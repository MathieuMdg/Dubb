spring.application.name=Dubb

spring.datasource.url=jdbc:h2:file:./src/main/resources/data/dubb-database

spring.datasource.username=Lonely
spring.datasource.password=

logging.level.com.lonelys.Dubb=DEBUG
logging.level.org.hibernate.SQL=DEBUG

app.storage.root=src/main/resources/storage

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
